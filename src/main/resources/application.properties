spring.application.name=outbox-relay
spring.datasource.url=jdbc:h2:mem:outbox;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.sql.init.mode=always
server.error.include-message=never

# relay (all overridable on the command line, see README)
outbox.relay-id=relay-1
outbox.batch-size=10
outbox.lease-millis=30000
outbox.max-attempts=5
outbox.base-backoff-millis=1000
outbox.max-backoff-millis=60000
outbox.poll-interval-millis=500
outbox.scheduler-enabled=true
outbox.publisher=memory
outbox.file-path=outbox-broker.jsonl
outbox.demo-consumer=true
